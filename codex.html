<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex — Epistemic Commons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/commons.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%231c1a15'/%3E%3Crect x='8' y='12' width='4' height='12' rx='2' fill='%23f6f4ee'/%3E%3Crect x='14' y='8' width='4' height='16' rx='2' fill='%235b78ec'/%3E%3Crect x='20' y='12' width='4' height='12' rx='2' fill='%23f6f4ee'/%3E%3C/svg%3E">
</head>
<body>
<script src="data/documents.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/md.js"></script>
<script>
(function () {
  const key = EC.qs("key") || "constitution";
  const codex = EC.codexByKey(key);
  if (!codex) { location.href = "codices.html"; return; }
  document.title = codex.title + " — Epistemic Commons";

  const docs = EC.documents.filter(d => d.codex === key);
  // order documents chronologically by first inscription
  docs.sort((a, b) => String(a.inscriptions[0]?.date || "").localeCompare(String(b.inscriptions[0]?.date || "")));

  const rows = docs.map(d => {
    const enacted = d.inscriptions.find(i => i.type === "enacted");
    const latest = d.inscriptions[d.inscriptions.length - 1];
    return `
    <a class="row" href="document.html?id=${d.id}">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true" style="flex:none">
        <path d="M5 2.5h7.5L16 6v11.5H5z" stroke="#8b8579" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M12 2.5V6h3.5" stroke="#8b8579" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      <div class="doc-main">
        <div class="doc-title">${d.title}</div>
        <div class="doc-meta">${enacted ? "Enacted " + EC.fmtDate(enacted.date) : d.type}</div>
      </div>
      <div class="spacer"></div>
      <div class="doc-side">
        <div class="doc-stats">${d.inscriptions.length} inscriptions<br>latest ${EC.fmtDate(latest && latest.date)}</div>
        ${EC.statusBadge(d.status)}
      </div>
    </a>`;
  }).join("");

  const sponsors = [...new Set(docs.flatMap(d => d.sponsors.map(s => s.name)))];
  // strip the H1 and the "Documents in this codex" table from the preamble (the file list replaces it)
  const preamble = codex.preamble
    .replace(/^#\s.*\n/, "")
    .replace(/## Documents in this codex[\s\S]*?(?=## )/, "");

  EC.shell("codices.html", `
  <main>
    <div class="wrap page-head">
      <div class="crumbs"><a href="index.html">Epistemic Commons</a> / <a href="codices.html">polity/uk</a> / ${key}</div>
      <div class="doc-titlebar">
        <h1>${codex.title}</h1>
        <div class="chambers" style="margin-top:14px">
          <span class="chamber commons"><span class="cdot"></span>commons</span>
          <span class="chamber lords"><span class="cdot"></span>lords</span>
          <span class="chamber assent"><span class="cdot"></span>assent</span>
          <span class="chamber statute done"><span class="cdot"></span>statute</span>
        </div>
      </div>
      <p class="lede" style="max-width:64ch;margin-top:14px">${codex.description}</p>
      <div class="codex-meta" style="margin-top:22px">
        <span class="avatar-stack">${sponsors.slice(0, 8).map(s => EC.avatar(s, 30)).join("")}</span>
        <span style="font-size:0.84rem;color:var(--ink-3)">${sponsors.length} sponsors · ${codex.stats.inscriptions} inscriptions · ${codex.stats.from}–${codex.stats.to}</span>
        <span class="custodian" style="font-size:0.84rem;color:var(--ink-3)">Custodian: ${codex.custodian}</span>
      </div>
    </div>

    <div class="wrap doc-layout" style="padding-bottom:20px">
      <div>
        <div class="overline" style="margin-bottom:12px">Documents · statute branch</div>
        <div class="filelist">${rows}</div>
        <div style="margin-top:44px">
          <div class="overline" style="margin-bottom:12px">Preamble</div>
          <article class="prose card" style="padding:30px 34px">${EC.md(preamble)}</article>
        </div>
      </div>
      <aside class="doc-aside">
        <div class="aside-block card" style="padding:20px">
          <h4>About this codex</h4>
          <p style="font-size:0.86rem;color:var(--ink-2)">Every document is a transcription with
          verified metadata; the authoritative text remains at its cited source. Open a document
          to read its full inscription history.</p>
        </div>
        <div class="aside-block card" style="padding:20px">
          <h4>Sponsors across history</h4>
          ${docs.flatMap(d => d.sponsors).slice(0, 7).map(s => `
            <div class="sponsor">${EC.avatar(s.name, 30)}
              <div><div class="s-name">${s.name}</div><div class="s-role">${s.role}</div></div>
            </div>`).join("")}
        </div>
      </aside>
    </div>
  </main>`);
})();
</script>
</body>
</html>
