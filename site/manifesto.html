<body>
<script src="data/documents.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/md.js"></script>
<script>
(function () {
  const man = EC.manifesto;
  // strip the H1, the italic subtitle line and the leading rule — the page header carries them
  let body = man.body.replace(/^#\s.*\n/, "").trimStart();
  body = body.replace(/^\*[^\n]+\*\n/, "").trimStart();
  body = body.replace(/^---+\n/, "").trimStart();
  EC.shell("manifesto.html", `
  <main>
    <div class="wrap page-head">
      <div class="crumbs"><a href="index.html">Epistemic Commons</a> / manifesto</div>
      <div class="overline" style="color:var(--ultramarine)">Founding document · version ${man.meta.version}</div>
      <h1 style="margin-top:12px">The Rationalist Manifesto</h1>
      <p class="lede" style="margin-top:14px">${man.meta.subtitle}</p>
      <div class="doc-facts" style="max-width:760px">
        <div class="fact"><div class="k">Status</div><div class="v">${man.meta.status}</div></div>
        <div class="fact"><div class="k">Adopted</div><div class="v">${EC.fmtDate(man.meta.adopted)}</div></div>
        <div class="fact"><div class="k">Source</div><div class="v"><span class="mono" style="font-size:0.78rem">manifesto/rationalist-manifesto.md</span></div></div>
      </div>
    </div>
    <div class="wrap" style="padding-bottom:30px">
      <article class="prose">${EC.md(body)}</article>
    </div>
  </main>`);
})();
</script>
</body>
