<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motions — Epistemic Commons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/commons.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%231c1a15'/%3E%3Cg transform='translate(16 16) scale(0.86) translate(-16 -16)' fill='none' stroke='%23f6f4ee' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M11.5 8 L6.5 16 L11.5 24'/%3E%3Cpath d='M20.5 8 L25.5 16 L20.5 24'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%235b78ec'/%3E%3C/svg%3E">
</head>
<body>
<script src="data/documents.js"></script>
<script src="data/motions.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/md.js"></script>
<script>
(function () {
  const ICONS = {
    enacted: `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="6" cy="6" r="2.6" stroke="#1e7a55" stroke-width="1.8"/><circle cx="6" cy="16" r="2.6" stroke="#1e7a55" stroke-width="1.8"/><circle cx="16" cy="11" r="2.6" stroke="#1e7a55" stroke-width="1.8"/><path d="M6 8.6v4.8M8.6 6c4 0 4.8 1.6 4.8 3" stroke="#1e7a55" stroke-width="1.8" stroke-linecap="round"/></svg>`,
    open: `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="6" cy="6" r="2.6" stroke="#2f4bd8" stroke-width="1.8"/><circle cx="6" cy="16" r="2.6" stroke="#2f4bd8" stroke-width="1.8"/><path d="M6 8.6v4.8" stroke="#2f4bd8" stroke-width="1.8" stroke-linecap="round"/><path d="M13 4l6 0m0 0l-2.2-2.2M19 4l-2.2 2.2" stroke="#2f4bd8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(-2 5)"/></svg>`,
    lapsed: `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8" stroke="#8b8579" stroke-width="1.8"/><path d="M7.5 7.5l7 7M14.5 7.5l-7 7" stroke="#8b8579" stroke-width="1.8" stroke-linecap="round"/></svg>`,
  };
  const BADGE = {
    enacted: `badge-inforce`, open: `badge-amended`, lapsed: `badge-neutral`,
  };

  function chamberPills(chambers) {
    return `<span class="chambers">` + chambers.map(c => {
      const done = c.state === "passed" || c.state === "merged";
      const mark = done ? "✓" : c.state === "active" ? "●" : c.state === "stalled" ? "⏸" : "·";
      return `<span class="chamber ${c.name} ${done ? "done" : ""}"><span class="cdot"></span>${c.name} ${mark}</span>`;
    }).join("") + `</span>`;
  }

  function voteBlock(v) {
    if (!v) return "";
    const total = v.aye + v.nay;
    return `
    <div style="margin-top:14px">
      <div style="font-size:0.74rem;color:var(--ink-3);margin-bottom:5px">${v.label}</div>
      <div class="votes">
        <span class="aye">Aye ${v.aye.toLocaleString()}</span>
        <span class="votebar" style="flex:1;max-width:280px">
          <span class="a" style="width:${(v.aye / total) * 100}%"></span>
          <span class="n" style="flex:1"></span>
        </span>
        <span class="nay">${v.nay.toLocaleString()} Nay</span>
      </div>
    </div>`;
  }

  function diffBlock(a) {
    if (!a) return "";
    return `
    <div class="overline" style="margin:18px 0 8px">Amendment</div>
    <div class="amendment">
      <div class="hunk-head">${a.file} — ${a.hunk}</div>
      ${a.lines.map(([kind, text]) => `<div class="ln ${kind}"><span class="sig">${kind === "add" ? "+" : "−"}</span>${text}</div>`).join("")}
    </div>`;
  }

  const cards = EC.motions.map(m => {
    const codex = EC.codexByKey(m.target);
    return `
    <div class="card" style="overflow:hidden">
      <div class="motion-row">
        <span class="motion-icon">${ICONS[m.status] || ICONS.open}</span>
        <div style="flex:1;min-width:0">
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <h3 style="flex:1;min-width:240px">${m.title}</h3>
            ${m.kind === "demo" ? `<span class="badge badge-superseded">Demonstration</span>` : `<span class="badge badge-neutral">Verified record</span>`}
            <span class="badge ${BADGE[m.status]}"><span class="dot"></span>${m.statusLabel}</span>
          </div>
          <div class="motion-meta">
            <span>opened ${EC.fmtDate(m.opened)}</span>
            ${m.closed ? `<span>closed ${EC.fmtDate(m.closed)}</span>` : ""}
            <span>→ <a href="codex.html?key=${m.target}">${codex ? codex.title : m.target}</a></span>
          </div>
          <p style="font-size:0.9rem;color:var(--ink-2);margin-top:10px;max-width:75ch">${m.summary}</p>
          <div style="display:flex;gap:18px;align-items:center;margin-top:14px;flex-wrap:wrap">
            <span class="avatar-stack">${m.sponsors.map(s => EC.avatar(s.name, 28)).join("")}</span>
            <span style="font-size:0.8rem;color:var(--ink-3)">${m.sponsors.map(s => s.name).join(" · ")}</span>
          </div>
          <div style="margin-top:14px">${chamberPills(m.chambers)}</div>
          ${voteBlock(m.votes)}
        </div>
      </div>
      <details class="motion-detail">
        <summary>Amendment & chamber record</summary>
        <div class="inner">
          ${diffBlock(m.amendment)}
          <div class="overline" style="margin:18px 0 8px">Chamber record</div>
          ${EC.inscriptionTimeline(m.timeline.map(t => ({ date: t.date, type: "reading", actor: "", note: t.note })))}
          ${m.source ? `<p style="font-size:0.82rem;margin-top:14px">Parliamentary record: <a href="${m.source}" target="_blank" rel="noopener">${m.source.replace("https://", "")}</a></p>` : ""}
        </div>
      </details>
    </div>`;
  }).join("");

  EC.shell("motions.html", `
  <main>
    <div class="wrap page-head">
      <div class="crumbs"><a href="index.html">Epistemic Commons</a> / polity/uk / motions</div>
      <h1>Motions</h1>
      <p class="lede" style="max-width:64ch;margin-top:14px">Proposed changes moving through the
      chambers — and the record of those that passed, failed, or lapsed. A motion is a small,
      legible amendment: never an omnibus. Four of these are transcriptions of real bills from
      the 2024–26 session; one demonstrates the citizen-initiated pathway.</p>
    </div>
    <div class="wrap" style="display:grid;gap:20px;padding-bottom:20px">${cards}</div>
  </main>`);
})();
</script>
</body>
</html>
