<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petitions — Epistemic Commons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/commons.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%231c1a15'/%3E%3Cg transform='translate(16 16) scale(0.86) translate(-16 -16)' fill='none' stroke='%23f6f4ee' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M11.5 8 L6.5 16 L11.5 24'/%3E%3Cpath d='M20.5 8 L25.5 16 L20.5 24'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%235b78ec'/%3E%3C/svg%3E">
</head>
<body>
<script src="data/documents.js"></script>
<script src="data/petitions.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/md.js"></script>
<script>
(function () {
  const BADGE = {
    "answered-motion": "badge-inforce",
    "awaiting-debate": "badge-amended",
    "responded": "badge-amended",
    "open": "badge-neutral",
  };
  const CAP = 100000;

  const cards = EC.petitions.map(p => {
    const pct = Math.min(100, (p.signatures / CAP) * 100);
    return `
    <div class="card" style="padding:22px 24px">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <span class="mono" style="font-size:0.74rem;color:var(--ink-3)">${p.id}</span>
        <h3 style="flex:1;min-width:260px">${p.title}</h3>
        <span class="badge ${BADGE[p.status]}"><span class="dot"></span>${p.statusLabel}</span>
      </div>
      <p style="font-size:0.9rem;color:var(--ink-2);margin-top:8px;max-width:76ch">${p.body}</p>
      <div class="threshold" style="max-width:560px">
        <div class="track"><div class="fill" style="width:${pct}%"></div></div>
        <div class="marks"><span>0</span><span>10k — response due</span><span>100k — debate due</span></div>
      </div>
      <div style="display:flex;gap:18px;margin-top:12px;flex-wrap:wrap;align-items:center">
        <span style="font-weight:700;font-size:0.95rem">${p.signatures.toLocaleString()} signatures</span>
        <span style="font-size:0.8rem;color:var(--ink-3)">opened ${EC.fmtDate(p.opened)} · codex: ${p.codex}</span>
        ${p.linkedMotion ? `<a href="motions.html" style="font-size:0.84rem;font-weight:600">→ answered with a motion</a>` : ""}
      </div>
      ${p.response ? `
      <div style="margin-top:14px;padding:12px 16px;background:var(--surface-2);border-radius:10px;font-size:0.86rem;color:var(--ink-2)">
        <span style="font-weight:700;color:var(--ink)">Answer.</span> ${p.response}
      </div>` : ""}
    </div>`;
  }).join("");

  EC.shell("petitions.html", `
  <main>
    <div class="wrap page-head">
      <div class="crumbs"><a href="index.html">Epistemic Commons</a> / polity/uk / petitions</div>
      <h1>Petitions</h1>
      <p class="lede" style="max-width:64ch;margin-top:14px">Any citizen may open a petition against
      any codex. At <b>10,000</b> verified signatures the custodians must respond; at <b>100,000</b>
      the legislature must debate it and either open a motion or publish its reasons for declining.
      Petitions are answered with motions, not press releases.</p>
      <p style="margin-top:12px"><span class="badge badge-superseded">Demonstration data</span>
      <span style="font-size:0.82rem;color:var(--ink-3);margin-left:8px">These petitions illustrate the
      pathway; thresholds mirror the UK Parliament e-petitions system.</span></p>
    </div>
    <div class="wrap" style="display:grid;gap:18px;padding-bottom:20px">${cards}</div>
  </main>`);
})();
</script>
</body>
</html>
