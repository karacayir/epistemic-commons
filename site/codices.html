<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codices — Epistemic Commons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/commons.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%231c1a15'/%3E%3Cg transform='translate(16 16) scale(0.86) translate(-16 -16)' fill='none' stroke='%23f6f4ee' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M11.5 8 L6.5 16 L11.5 24'/%3E%3Cpath d='M20.5 8 L25.5 16 L20.5 24'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%235b78ec'/%3E%3C/svg%3E">
</head>
<body>
<script src="data/documents.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/md.js"></script>
<script>
(function () {
  const cards = EC.codices.map(c => {
    const docs = EC.documents.filter(d => d.codex === c.key);
    const sponsors = [...new Set(docs.flatMap(d => d.sponsors.map(s => s.name)))];
    return `
    <a class="card" style="padding:26px" href="codex.html?key=${c.key}">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span class="mono" style="font-size:0.78rem;color:var(--ink-3)">uk / ${c.key}</span>
        <span class="badge badge-neutral">${c.stats.documents} documents</span>
      </div>
      <h3 style="margin:12px 0 8px;font-size:1.42rem">${c.title}</h3>
      <p style="font-size:0.92rem;color:var(--ink-2);max-width:64ch">${c.description}</p>
      <div class="codex-meta">
        <span class="avatar-stack">${sponsors.slice(0, 5).map(s => EC.avatar(s, 28)).join("")}</span>
        <span style="font-size:0.78rem;color:var(--ink-3)">${sponsors.length} sponsors · ${c.stats.inscriptions} inscriptions · ${c.stats.from}–${c.stats.to}</span>
        <span class="custodian" style="font-size:0.82rem;color:var(--ink-3)">Custodian: ${c.custodian}</span>
      </div>
    </a>`;
  }).join("");

  EC.shell("codices.html", `
  <main>
    <div class="wrap page-head">
      <div class="crumbs"><a href="index.html">Epistemic Commons</a> / polity/uk / codices</div>
      <h1>The Codices</h1>
      <p class="lede" style="max-width:62ch;margin-top:14px">The governed bodies of law of the United
      Kingdom, transcribed with their true histories — sponsors, readings, referendums, assents,
      amendments and repeals. Related instruments live together; distinct domains live apart.</p>
    </div>
    <div class="wrap" style="display:grid;gap:20px;padding-bottom:20px">${cards}</div>
  </main>`);
})();
</script>
</body>
</html>
