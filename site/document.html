<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Document — Epistemic Commons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/commons.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%231c1a15'/%3E%3Crect x='8' y='12' width='4' height='12' rx='2' fill='%23f6f4ee'/%3E%3Crect x='14' y='8' width='4' height='16' rx='2' fill='%235b78ec'/%3E%3Crect x='20' y='12' width='4' height='12' rx='2' fill='%23f6f4ee'/%3E%3C/svg%3E">
</head>
<body>
<script src="data/documents.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/md.js"></script>
<script>
(function () {
  const id = EC.qs("id");
  const doc = EC.byId(id) || EC.documents[0];
  const codex = EC.codexByKey(doc.codex);
  document.title = doc.title + " — Epistemic Commons";

  const enacted = doc.inscriptions.find(i => i.type === "enacted");
  const body = doc.body.replace(/^#\s.*\n/, "");

  EC.shell("codices.html", `
  <main>
    <div class="wrap page-head">
      <div class="crumbs">
        <a href="index.html">Epistemic Commons</a> /
        <a href="codices.html">polity/uk</a> /
        <a href="codex.html?key=${doc.codex}">${doc.codex}</a> /
        <span class="mono" style="font-size:0.78rem">${doc.id}.md</span>
      </div>
      <div class="doc-titlebar">
        <h1>${doc.title}</h1>
        <div style="margin-top:14px">${EC.statusBadge(doc.status)}</div>
      </div>
      <div class="doc-facts">
        <div class="fact"><div class="k">Citation</div><div class="v mono" style="font-size:0.84rem">${doc.citation || "—"}</div></div>
        <div class="fact"><div class="k">Type</div><div class="v">${doc.type}</div></div>
        <div class="fact"><div class="k">Enacted</div><div class="v">${enacted ? EC.fmtDate(enacted.date) : "—"}</div></div>
        <div class="fact"><div class="k">Custodian</div><div class="v">${doc.custodian || (codex && codex.custodian) || "—"}</div></div>
        <div class="fact"><div class="k">Inscriptions</div><div class="v">${doc.inscriptions.length}</div></div>
      </div>
    </div>

    <div class="wrap doc-layout" style="padding-bottom:20px">
      <div>
        <article class="prose">${EC.md(body)}</article>
        <div style="margin-top:52px">
          <h2 class="serif" style="font-size:1.5rem;padding-top:26px;border-top:1px solid var(--hairline)">Inscription history</h2>
          <p style="color:var(--ink-2);font-size:0.92rem;margin:8px 0 24px;max-width:62ch">
            The recorded life of this document — every proposal, reading, referendum,
            assent, amendment and repeal, oldest first. History is never rewritten, only extended.</p>
          ${EC.inscriptionTimeline(doc.inscriptions)}
        </div>
      </div>

      <aside class="doc-aside">
        <div class="aside-block card" style="padding:20px">
          <h4>Sponsors</h4>
          ${doc.sponsors.map(s => `
            <div class="sponsor">${EC.avatar(s.name, 32)}
              <div><div class="s-name">${s.name}</div><div class="s-role">${s.role}</div></div>
            </div>`).join("")}
        </div>
        <div class="aside-block card" style="padding:20px">
          <h4>Authoritative source</h4>
          <p style="font-size:0.85rem;color:var(--ink-2);line-height:1.55">This transcription is
          editorial; the text of record is:</p>
          <p style="margin-top:10px;font-size:0.85rem;word-break:break-all">
            <a href="${doc.source}" target="_blank" rel="noopener">${doc.source.replace("https://www.", "")}</a></p>
        </div>
        <div class="aside-block card" style="padding:20px">
          <h4>Themes</h4>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            ${(doc.themes || []).map(t => `<span class="chip">${t}</span>`).join("")}
          </div>
        </div>
        <div class="aside-block card" style="padding:20px">
          <h4>In this codex</h4>
          <p style="font-size:0.86rem"><a href="codex.html?key=${doc.codex}">${codex ? codex.title : doc.codex}</a></p>
          <p style="font-size:0.78rem;color:var(--ink-3);margin-top:6px">${codex ? codex.stats.documents + " documents · " + codex.stats.from + "–" + codex.stats.to : ""}</p>
        </div>
      </aside>
    </div>
  </main>`);
})();
</script>
</body>
</html>
